<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Brick Party Campaign</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --brown-700: #5D4037;
            --brown-500: #795548;
            --brown-100: #D7CCC8;
            --brown-50: #EFEBE9;
            --blue-900: #0D1B3E;
            --blue-800: #1A237E;
            --blue-700: #1565C0;
            --blue-500: #2196F3;
            --gold-accent: #FFB300;
            --gold-light: #FFD54F;
            --red-accent: #C62828;
            --white: #FFFFFF;
            --off-white: #F8F6F4;
            --dark: #1A1A1A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--blue-900) 0%, var(--brown-700) 50%, var(--blue-900) 100%);
            position: relative;
            overflow: hidden;
        }

        /* Animated background stars */
        .bg-stars {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 0;
        }

        .bg-star {
            position: absolute;
            background: var(--white);
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% {
                opacity: 0.15;
                transform: scale(1);
            }

            100% {
                opacity: 0.8;
                transform: scale(1.4);
            }
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .login-header {
            text-align: center;
            padding: 40px 36px 24px;
        }

        .login-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(255, 179, 0, 0.15);
            border: 2px solid rgba(255, 179, 0, 0.3);
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(255, 179, 0, 0.3);
            }

            50% {
                box-shadow: 0 0 0 15px rgba(255, 179, 0, 0);
            }
        }

        .login-logo i {
            font-size: 1.8rem;
            color: var(--gold-accent);
        }

        .login-header h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 1.8rem;
            color: var(--white);
            letter-spacing: 3px;
            margin-bottom: 6px;
        }

        .login-header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }

        .login-form {
            padding: 10px 36px 36px;
        }

        .form-field {
            margin-bottom: 20px;
        }

        .form-field label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-field label i {
            color: var(--gold-accent);
        }

        .form-field input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--white);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: 0.3s ease;
        }

        .form-field input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .form-field input:focus {
            outline: none;
            border-color: var(--gold-accent);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 4px rgba(255, 179, 0, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--brown-700), var(--brown-500));
            color: var(--white);
            border: none;
            border-radius: 14px;
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(121, 85, 72, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 200%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: 0.6s;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(121, 85, 72, 0.6);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-msg {
            display: none;
            margin-top: 16px;
            padding: 12px 16px;
            background: rgba(198, 40, 40, 0.15);
            border: 1px solid rgba(198, 40, 40, 0.3);
            border-radius: 10px;
            color: #EF9A9A;
            font-size: 0.88rem;
            text-align: center;
            animation: shake 0.4s ease;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-8px);
            }

            75% {
                transform: translateX(8px);
            }
        }

        .login-footer {
            text-align: center;
            padding: 0 36px 30px;
        }

        .login-footer a {
            color: var(--gold-accent);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 500;
            transition: 0.2s;
        }

        .login-footer a:hover {
            color: var(--gold-light);
            text-decoration: underline;
        }

        .login-footer .back-home {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            color: rgba(255, 255, 255, 0.5);
        }

        .login-footer .back-home:hover {
            color: var(--white);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 20px 0;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body>
    <!-- Background stars -->
    <div class="bg-stars" id="bg-stars"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fas fa-chess-rook"></i>
                </div>
                <h1>BRICK PARTY</h1>
                <p>Candidate & Admin Login</p>
            </div>

            <form class="login-form" id="login-form">
                <div class="form-field">
                    <label><i class="fas fa-user"></i> Username</label>
                    <input type="text" id="username" placeholder="Enter your username" required autofocus>
                </div>
                <div class="form-field">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="login-btn" id="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
                <div class="error-msg" id="error-msg"></div>
            </form>

            <div class="login-footer">
                <div class="divider">or</div>
                <a href="/" class="back-home">
                    <i class="fas fa-arrow-left"></i> Back to Campaign Website
                </a>
            </div>
        </div>
    </div>

    <script>
        // Generate background stars
        const starsContainer = document.getElementById('bg-stars');
        for (let i = 0; i < 30; i++) {
            const star = document.createElement('div');
            star.className = 'bg-star';
            star.style.width = star.style.height = Math.random() * 3 + 1 + 'px';
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            starsContainer.appendChild(star);
        }

        // Check if already logged in
        const session = localStorage.getItem('brickparty_user');
        if (session) {
            window.location.href = '/dashboard';
        }

        // Login form
        const form = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');
        const loginBtn = document.getElementById('login-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            // Loading state
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing In...';
            loginBtn.disabled = true;
            errorMsg.style.display = 'none';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (data.success) {
                    // Save session
                    localStorage.setItem('brickparty_user', JSON.stringify(data.user));

                    // Success animation
                    loginBtn.innerHTML = '<i class="fas fa-check-circle"></i> Welcome, ' + data.user.name + '!';
                    loginBtn.style.background = 'linear-gradient(135deg, #2E7D32, #43A047)';

                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1200);
                } else {
                    throw new Error(data.message);
                }
            } catch (err) {
                errorMsg.textContent = err.message || 'Login failed. Please try again.';
                errorMsg.style.display = 'block';
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                loginBtn.disabled = false;
                loginBtn.style.background = '';
            }
        });
    </script>
</body>

</html>
